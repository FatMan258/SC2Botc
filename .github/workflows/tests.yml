name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: python -m compileall -q BOTC_Tools

      - name: Run unit tests
        run: python -m unittest discover -s BOTC_Tools\tests -v

      - name: Check Galaxy source
        run: python BOTC_Tools\botc.py check

      - name: Validate example role DSL
        run: python BOTC_Tools\botc.py design validate BOTC_Tools\role_specs\role_dsl.example.json

      - name: Validate prototype role DSL
        run: python BOTC_Tools\botc.py design validate BOTC_Tools\role_specs\role_148_nightmare_dealer.json
