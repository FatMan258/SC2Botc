name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python tools
        run: python -m compileall -q tools

      - name: Run unit tests
        run: python -m unittest discover -s tools\tests -v

      - name: Check Galaxy source
        run: python tools\botc.py check scripts\BOTC.galaxy

      - name: Check build environment
        run: python tools\botc.py doctor

      - name: Validate example role DSL
        run: python tools\botc.py design validate roles\role_dsl.example.json

      - name: Build production smoke map
        run: python tools\botc.py build --script scripts\BOTC.galaxy --out work\BOTC.ci.SC2Map --split-script

      - name: Inspect production smoke map
        run: python tools\botc.py inspect work\BOTC.ci.SC2Map
